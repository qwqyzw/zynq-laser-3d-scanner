<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zynq 本轮__SHAPE_LABEL__补面模型</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111d2c;color:#e6eef8;font:16px system-ui,"Microsoft YaHei",sans-serif}header{padding:22px 30px;background:#192b40;border-bottom:1px solid #33465e}h1{font-size:23px;margin:0 0 10px}p{margin:8px 0;color:#bacbde}.tag{color:#ffd68c}main{display:grid;grid-template-columns:1fr 310px;height:calc(100vh - 144px);min-height:500px}canvas{width:100%;height:100%;touch-action:none}aside{padding:22px;background:#172639}button,select{font:inherit;border:1px solid #50657b;border-radius:7px;padding:9px;color:#e6eef8;background:#223b54;margin:6px 0;width:100%}label{display:block;margin:18px 0}small{color:#a5b8cc;line-height:1.7}strong{color:white}#stats{line-height:1.9}a{color:#a5d9ff}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}canvas{height:60vh}aside{padding:16px}}</style>
<header><h1>Zynq · __SHAPE_LABEL__补面模型</h1><div class="tag">__ASSUMPTION__</div><p>拖动旋转 · 滚轮缩放 · 双击复位。模型由Zynq生成，本页面只负责显示。</p></header>
<main><canvas id="view"></canvas><aside><strong>显示方式</strong><select id="mode"><option value="mesh">白色展示模型（算法估计）</option><option value="overlay">估计表面＋实测点</option><option value="points">只看实测点</option><option value="support">估计表面范围（橙色）</option></select><label><input id="spin" type="checkbox" checked> 自动旋转</label><button id="reset">复位视角</button><div id="stats"></div><p id="source"></p><small>按所选形状拟合本轮测点，遮挡面和底面包含算法估计。原始点云独立保留，所有网格面均为估计，不代表完整表面测量或尺寸精度验收。</small><p><a href="ESTIMATED_UPPER_SURFACE.ply">下载__SHAPE_LABEL__估计模型 PLY</a><br><a href="denoised_points.ply">下载去噪点云</a><br><a href="measured_points.ply">下载建面输入点云</a></p></aside></main>
<script>
const data=__MODEL_DATA__;const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),mode=document.querySelector('#mode'),spin=document.querySelector('#spin');
let yaw=.65,pitch=.38,zoom=1,drag=false,last=[0,0],lastTime=performance.now();const v=data.vertices,pts=data.points;
const lo=[0,1,2].map(i=>Math.min(...v.map(p=>p[i]))),hi=[0,1,2].map(i=>Math.max(...v.map(p=>p[i]))),center=lo.map((x,i)=>(x+hi[i])/2),span=Math.max(...hi.map((x,i)=>x-lo[i]));
document.querySelector('#stats').innerHTML=`<p>建面输入 <strong>${data.stats.raw_points}</strong><br>物体测点 <strong>${data.stats.foreground_points}</strong><br>保留测点 <strong>${data.stats.denoised_points}</strong><br>估计三角面 <strong>${data.stats.mesh_faces}</strong><br>单位 <strong>毫米</strong></p>`;
document.querySelector('#stats').innerHTML+='<p>'+data.stats.dimensions_note+'<br>拟合残差 p95 '+data.stats.fit_residual_p95_mm.toFixed(2)+' mm<br>'+data.stats.warnings.join('<br>')+'</p>';
document.querySelector('#source').textContent='来源：'+data.source_run.slice(0,12)+'…（本轮独立表面候选）';
function reset(){yaw=.65;pitch=.38;zoom=1}document.querySelector('#reset').onclick=reset;canvas.ondblclick=reset;
canvas.onpointerdown=e=>{drag=true;last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=false;
canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-last[0])*.009;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-last[1])*.009));last=[e.clientX,e.clientY]}};
canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.3,Math.min(4,zoom*Math.exp(-e.deltaY*.001)))};
const faceNormals=data.faces.map(f=>{const a=v[f[0]],b=v[f[1]],c=v[f[2]],u=b.map((x,j)=>x-a[j]),w=c.map((x,j)=>x-a[j]),n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]],l=Math.hypot(...n)||1;return n.map(x=>x/l)});const adjacent=v.map(()=>[]);data.faces.forEach((f,i)=>f.forEach(j=>adjacent[j].push(i)));const softNormals=data.faces.map((f,i)=>{let n=[0,0,0];const seen=new Set(f.flatMap(j=>adjacent[j]));for(const k of seen){const q=faceNormals[k];if(q.reduce((s,x,j)=>s+x*faceNormals[i][j],0)>=Math.cos(35*Math.PI/180))n=n.map((x,j)=>x+q[j])}const l=Math.hypot(...n)||1;return n.map(x=>x/l)});function rotateNormal(a){const u=a[0]*Math.cos(yaw)-a[1]*Math.sin(yaw),w=a[0]*Math.sin(yaw)+a[1]*Math.cos(yaw);return [u,w*Math.cos(pitch)-a[2]*Math.sin(pitch),w*Math.sin(pitch)+a[2]*Math.cos(pitch)]}
function transform(a){let x=a[0]-center[0],y=a[1]-center[1],z=a[2]-center[2],u=x*Math.cos(yaw)-y*Math.sin(yaw),w=x*Math.sin(yaw)+y*Math.cos(yaw);return [u,w*Math.cos(pitch)-z*Math.sin(pitch),w*Math.sin(pitch)+z*Math.cos(pitch)]}
function frame(t){const dt=Math.min((t-lastTime)/1000,.05);lastTime=t;if(spin.checked&&!drag)yaw+=dt*.18;const dpr=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w*dpr||canvas.height!==h*dpr){canvas.width=w*dpr;canvas.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1c334c');g.addColorStop(1,'#0b1522');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const scale=Math.min(w,h)*.7/span*zoom;
const rotated=v.map(transform),screen=rotated.map(p=>[w/2+p[0]*scale,h/2-p[2]*scale]);
if(mode.value!=='points'){const order=data.faces.map((f,i)=>({f,i,depth:f.reduce((a,j)=>a+rotated[j][1],0)/3})).sort((a,b)=>b.depth-a.depth);for(const {f,i} of order){let a=rotated[f[0]],b=rotated[f[1]],c=rotated[f[2]],u=b.map((x,j)=>x-a[j]),z=c.map((x,j)=>x-a[j]);let n=[u[1]*z[2]-u[2]*z[1],u[2]*z[0]-u[0]*z[2],u[0]*z[1]-u[1]*z[0]],len=Math.hypot(...n)||1;const sn=rotateNormal(data.stats.shape_type==='triangular_pyramid'?faceNormals[i]:softNormals[i]);if(rotateNormal(faceNormals[i])[1]>=0)continue;let shade=Math.round(170+80*Math.max(0,-.4*sn[0]-.7*sn[1]+.6*sn[2]));ctx.beginPath();f.forEach((j,k)=>k?ctx.lineTo(...screen[j]):ctx.moveTo(...screen[j]));ctx.closePath();ctx.fillStyle=mode.value==='support'&&data.weak[i]?`rgb(${shade},${Math.round(shade*.65)},${Math.round(shade*.3)})`:`rgb(${shade},${shade},${Math.min(255,shade+5)})`;ctx.fill();}}
if(mode.value==='points'||mode.value==='overlay'){ctx.fillStyle=mode.value==='overlay'?'#6ae8ff':'#effaff';for(const p of pts.map(transform)){ctx.beginPath();ctx.arc(w/2+p[0]*scale,h/2-p[2]*scale,mode.value==='overlay'?1.4:2,0,Math.PI*2);ctx.fill()}}
ctx.fillStyle='#bacbde';ctx.font='13px system-ui';ctx.fillText('Z ↑  |  毫米  |  展示网格为形状估计',22,h-22);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
